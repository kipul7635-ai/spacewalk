<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Walk to the Stars</title>
<style>
  :root {
    --bg: #000000;
    --panel: rgba(0, 0, 0, 0.85);
    --border: #333333;
    --text: #ffffff;
    --text-dim: #888888;
    --font: ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, monospace;
  }
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    border-radius: 0;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    overflow: hidden;
    height: 100vh;
    height: 100dvh;
    -webkit-font-smoothing: antialiased;
  }
  .hidden { display: none !important; }

  /* Layout */
  #app {
    display: grid;
    grid-template-columns: 260px 1fr;
    height: 100%;
    width: 100%;
  }
  @media (max-width: 768px) {
    #app {
      grid-template-columns: 1fr;
      grid-template-rows: 220px 1fr;
    }
  }

  /* Sidebar */
  aside {
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    z-index: 10;
  }
  .sidebar-head {
    padding: 16px;
    border-bottom: 1px solid var(--border);
  }
  h1 {
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  #tagline {
    font-size: 0.65rem;
    color: var(--text-dim);
    margin-top: 6px;
    line-height: 1.5;
  }
  #list {
    list-style: none;
    overflow-y: auto;
    flex: 1;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  #list::-webkit-scrollbar { width: 4px; }
  #list::-webkit-scrollbar-thumb { background: var(--border); }
  
  .item-btn {
    width: 100%;
    background: none;
    border: none;
    border-bottom: 1px solid var(--border);
    color: var(--text-dim);
    font-family: var(--font);
    font-size: 0.8rem;
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    transition: background 0.1s, color 0.1s;
  }
  .item-btn:hover {
    background: rgba(255, 255, 255, 0.05);
    color: var(--text);
  }
  .item-btn.active {
    background: rgba(255, 255, 255, 0.1);
    color: var(--text);
    border-left: 2px solid var(--text);
    padding-left: 14px;
  }
  .item-symbol {
    font-size: 1rem;
    width: 24px;
    text-align: center;
  }

  /* Canvas Area */
  main {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: grab;
  }
  canvas:active { cursor: grabbing; }

  /* HUD Overlay */
  .hud {
    position: absolute;
    pointer-events: none;
    z-index: 5;
  }
  .hud * { pointer-events: auto; }

  /* Scale Bar (Bottom Left) */
  #scale-hud {
    bottom: 24px;
    left: 24px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .scale-line {
    height: 8px;
    border-left: 1px solid var(--text);
    border-right: 1px solid var(--text);
    border-bottom: 1px solid var(--text);
    width: 100px;
    transition: width 0.1s;
  }
  .scale-text {
    font-size: 0.7rem;
    color: var(--text);
    background: rgba(0,0,0,0.5);
    padding: 2px 4px;
    display: inline-block;
    align-self: flex-start;
  }

  /* GO Button (Bottom Center) */
  #go-btn {
    position: absolute;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%);
    background: transparent;
    border: 1px solid var(--text);
    color: var(--text);
    font-family: var(--font);
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 0.2em;
    padding: 12px 48px;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
  }
  #go-btn:hover {
    background: var(--text);
    color: var(--bg);
  }

  /* Top Banner */
  #banner {
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 8px 16px;
    font-size: 0.75rem;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  #banner button {
    background: none;
    border: none;
    color: var(--text);
    font-family: var(--font);
    font-size: 0.75rem;
    cursor: pointer;
    text-transform: uppercase;
  }
  #banner button:hover { text-decoration: underline; }

  /* Walk View */
  #walkView {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.95);
    z-index: 20;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 24px;
  }
  .walk-container {
    width: 100%;
    max-width: 600px;
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 32px;
  }
  .walk-container h2 {
    font-size: 1.5rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 24px;
    color: var(--text);
  }
  .progress-bar {
    width: 100%;
    height: 2px;
    background: var(--border);
    margin: 24px 0;
    position: relative;
  }
  .progress-fill {
    height: 100%;
    background: var(--text);
    width: 0%;
    transition: width 0.5s linear;
  }
  .progress-pct {
    font-size: 3rem;
    font-weight: 700;
    margin-bottom: 8px;
    font-variant-numeric: tabular-nums;
  }
  .grid-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 32px;
  }
  .stat-box {
    border: 1px solid var(--border);
    padding: 12px;
  }
  .stat-label {
    font-size: 0.65rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 4px;
  }
  .stat-val {
    font-size: 1rem;
    font-variant-numeric: tabular-nums;
  }
  .walk-actions {
    display: flex;
    gap: 16px;
  }
  .btn {
    flex: 1;
    background: transparent;
    border: 1px solid var(--text);
    color: var(--text);
    font-family: var(--font);
    font-size: 0.75rem;
    padding: 12px 16px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    transition: all 0.2s;
  }
  .btn:hover {
    background: var(--text);
    color: var(--bg);
  }
</style>
</head>
<body>

<div id="app">
  <aside>
    <div class="sidebar-head">
      <h1>Walk to the Stars</h1>
      <p id="tagline">Drag to pan. Scroll to zoom. Select a destination to visualise the true scale.</p>
    </div>
    <ul id="list"></ul>
  </aside>

  <main>
    <canvas id="space-canvas"></canvas>

    <div id="banner" class="hud hidden">
      <span>In transit to <b id="bannerDest"></b></span>
      <button id="bannerResume" type="button">Resume Walk →</button>
    </div>

    <div id="scale-hud" class="hud">
      <div class="scale-text" id="scaleText">10,000 km</div>
      <div class="scale-line" id="scaleLine"></div>
    </div>

    <button id="go-btn" class="hidden" type="button">GO</button>

    <div id="walkView" class="hidden">
      <div class="walk-container">
        <h2 id="wTitle">Walking to the Moon</h2>
        
        <div class="progress-pct" id="wPct">0%</div>
        <div class="progress-bar">
          <div class="progress-fill" id="wFill"></div>
        </div>

        <div class="grid-stats">
          <div class="stat-box">
            <div class="stat-label">Distance Walked</div>
            <div class="stat-val" id="wWalked">0 m</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Distance Left</div>
            <div class="stat-val" id="wLeft">384,400 km</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Time Elapsed</div>
            <div class="stat-val" id="wElapsed">0s</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Est. Arrival</div>
            <div class="stat-val" id="wEta">—</div>
          </div>
        </div>

        <div class="walk-actions">
          <button class="btn" id="wBrowse" type="button">Back to Map</button>
          <button class="btn" id="wAbandon" type="button">Abandon</button>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
(() => {
  'use strict';

  const PACE = 5;               // km/h
  const KEY  = 'walk-to-the-stars.walk.v3';

  // Distances and diameters in km.
  // Sorted by distance.
  const CATALOG = [
    { id:'moon',      name:'The Moon',      symbol:'☽', dist:384400,      diam:3474,    desc:'Our closest neighbour.' },
    { id:'venus',     name:'Venus',         symbol:'♀', dist:42000000,    diam:12104,   desc:'The hottest planet, wrapped in thick clouds.' },
    { id:'mars',      name:'Mars',          symbol:'♂', dist:75000000,    diam:6779,    desc:'The red planet. Dust storms included.' },
    { id:'mercury',   name:'Mercury',       symbol:'☿', dist:91500000,    diam:4879,    desc:'The smallest planet and the fastest orbiter.' },
    { id:'halley',    name:'Halley’s Comet',symbol:'☄', dist:100000000,   diam:11,      desc:'A periodic comet that visits every ~76 years.' },
    { id:'sun',       name:'The Sun',       symbol:'☀', dist:149597870,   diam:1392700, desc:'Eight light-minutes away. Bring sunscreen.' },
    { id:'ceres',     name:'Ceres',         symbol:'⚳', dist:265050000,   diam:946,     desc:'The largest object in the asteroid belt.' },
    { id:'jupiter',   name:'Jupiter',       symbol:'♃', dist:630000000,   diam:139820,  desc:'The giant of the solar system.' },
    { id:'saturn',    name:'Saturn',        symbol:'♄', dist:1290000000,  diam:116460,  desc:'Famous for its rings — mostly ice and rock.' },
    { id:'uranus',    name:'Uranus',        symbol:'♅', dist:2715000000,  diam:50724,   desc:'An ice giant tipped on its side.' },
    { id:'neptune',   name:'Neptune',       symbol:'♆', dist:4350000000,  diam:49244,   desc:'The windiest planet.' },
    { id:'pluto',     name:'Pluto',         symbol:'♇', dist:5760000000,  diam:2376,    desc:'A dwarf planet in the Kuiper Belt.' },
  ];

  // Formatters
  const nf  = new Intl.NumberFormat('en-US');
  const nf1 = new Intl.NumberFormat('en-US', { maximumFractionDigits: 1 });
  
  function fmtKm(km) {
    if (km < 1e6) return nf.format(Math.round(km)) + ' km';
    return nf1.format(km / 1e6) + 'M km';
  }

  function fmtWalked(km) {
    if (km < 1) return (km * 1000).toFixed(1) + ' m';
    if (km < 1000) return km.toFixed(2) + ' km';
    return fmtKm(km);
  }

  function fmtDur(hours) {
    if (hours < 1) return Math.round(hours * 60) + ' min';
    if (hours < 48) return nf1.format(hours) + ' hours';
    const days = hours / 24;
    if (days < 730) return nf1.format(days) + ' days';
    const years = days / 365.25;
    if (years < 1e6) return nf1.format(years) + ' years';
    return nf1.format(years / 1e6) + ' million years';
  }

  function fmtElapsed(ms) {
    const s = Math.floor(ms / 1000);
    if (s < 60) return s + 's';
    const m = Math.floor(s / 60);
    if (m < 60) return `${m}m ${s % 60}s`;
    const h = Math.floor(m / 60);
    if (h < 24) return `${h}h ${m % 60}m`;
    return `${Math.floor(h / 24)}d ${h % 24}h`;
  }

  // State
  let walk = readWalk();
  let selectedId = CATALOG[0].id;
  let timer = null;

  // DOM Elements
  const $ = id => document.getElementById(id);
  const listEl = $('list');
  const walkViewEl = $('walkView');
  const goBtn = $('go-btn');
  const scaleText = $('scaleText'), scaleLine = $('scaleLine');

  const wTitle = $('wTitle'), wPct = $('wPct'), wFill = $('wFill'),
        wWalked = $('wWalked'), wLeft = $('wLeft'),
        wElapsed = $('wElapsed'), wEta = $('wEta');

  // Storage
  function readWalk() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return null;
      const w = JSON.parse(raw);
      if (!w || typeof w.startedAt !== 'number') return null;
      if (!CATALOG.some(o => o.id === w.objectId)) return null;
      return w;
    } catch (e) { return null; }
  }
  function writeWalk(w) {
    try {
      if (w) localStorage.setItem(KEY, JSON.stringify(w));
      else localStorage.removeItem(KEY);
    } catch (e) {}
  }

  // ==========================================
  // CANVAS ENGINE
  // ==========================================
  const canvas = $('space-canvas');
  const ctx = canvas.getContext('2d');
  
  // Base scale: 1 pixel = 1,000 km
  const BASE_KM_PER_PX = 1000;

  let cam = {
    x: 0,
    y: 0,
    zoom: 1,
    isDragging: false,
    lastX: 0,
    lastY: 0
  };

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.scale(dpr, dpr);
    draw();
  }

  function draw() {
    const rect = canvas.parentElement.getBoundingClientRect();
    const w = rect.width;
    const h = rect.height;
    
    ctx.clearRect(0, 0, w, h);
    drawStars(w, h);

    ctx.save();
    ctx.translate(w / 2 + cam.x, h / 2 + cam.y);
    ctx.scale(cam.zoom, cam.zoom);

    const lineWidth = 1 / cam.zoom;
    const target = CATALOG.find(o => o.id === selectedId);
    if (!target) { ctx.restore(); return; }

    // Draw Dotted Line
    const distPx = target.dist / BASE_KM_PER_PX;
    ctx.beginPath();
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
    ctx.lineWidth = Math.max(1, lineWidth * 1.5);
    ctx.setLineDash([4 * lineWidth, 8 * lineWidth]);
    ctx.moveTo(0, 0);
    ctx.lineTo(0, -distPx);
    ctx.stroke();
    ctx.setLineDash([]); 

    // Draw Earth
    drawPlanet(0, 0, 12742, 'Earth', '#ffffff', lineWidth);
    
    // Draw Target
    drawPlanet(0, -distPx, target.diam, target.name, '#ffffff', lineWidth);

    // Distance text
    if (distPx * cam.zoom > 100) {
      ctx.save();
      ctx.translate(0, -distPx / 2);
      ctx.fillStyle = '#000';
      const text = fmtKm(target.dist);
      ctx.font = `${14 / cam.zoom}px monospace`;
      const textWidth = ctx.measureText(text).width;
      ctx.fillRect(10 / cam.zoom, -10 / cam.zoom, textWidth + 8 / cam.zoom, 20 / cam.zoom);
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, 14 / cam.zoom, 0);
      ctx.restore();
    }

    ctx.restore();
    updateScaleHUD(w);
  }

  function drawPlanet(x, y, diamKm, name, color, lineWidth) {
    const rPx = (diamKm / 2) / BASE_KM_PER_PX;
    
    if (rPx * cam.zoom > 1.5) {
      ctx.beginPath();
      ctx.arc(x, y, rPx, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
    } else {
      // Marker for tiny planets
      ctx.beginPath();
      ctx.arc(x, y, 2 / cam.zoom, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
      
      const arm = 5 / cam.zoom;
      ctx.beginPath();
      ctx.moveTo(x - arm, y); ctx.lineTo(x + arm, y);
      ctx.moveTo(x, y - arm); ctx.lineTo(x, y + arm);
      ctx.strokeStyle = color;
      ctx.lineWidth = lineWidth;
      ctx.stroke();
    }

    // Text Label
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = '#fff';
    ctx.font = `${12 / cam.zoom}px monospace`;
    ctx.textAlign = 'center';
    const offset = Math.max(10 / cam.zoom, rPx + 10 / cam.zoom);
    ctx.fillText(name, 0, offset);
    ctx.restore();
  }

  let starCache = [];
  function drawStars(w, h) {
    if (starCache.length === 0) {
      for (let i = 0; i < 150; i++) {
        starCache.push({
          x: Math.random(),
          y: Math.random(),
          s: Math.random() * 1.5 + 0.5,
          o: Math.random() * 0.3 + 0.1
        });
      }
    }
    ctx.fillStyle = '#fff';
    starCache.forEach(s => {
      ctx.globalAlpha = s.o;
      ctx.fillRect(s.x * w, s.y * h, s.s, s.s);
    });
    ctx.globalAlpha = 1;
  }

  function updateScaleHUD(w) {
    const targetPx = 150;
    const kmFor150px = (targetPx / cam.zoom) * BASE_KM_PER_PX;
    const magnitude = Math.pow(10, Math.floor(Math.log10(kmFor150px)));
    const normalized = kmFor150px / magnitude;
    
    let niceMultiplier;
    if (normalized < 1.5) niceMultiplier = 1;
    else if (normalized < 3.5) niceMultiplier = 2;
    else if (normalized < 7.5) niceMultiplier = 5;
    else niceMultiplier = 10;
    
    const niceKm = magnitude * niceMultiplier;
    const nicePx = (niceKm / BASE_KM_PER_PX) * cam.zoom;
    
    scaleLine.style.width = `${nicePx}px`;
    if (niceKm >= 1e6) {
      scaleText.textContent = `${nf1.format(niceKm / 1e6)} million km`;
    } else {
      scaleText.textContent = `${nf.format(niceKm)} km`;
    }
  }

  // ==========================================
  // INTERACTIVITY
  // ==========================================
  canvas.addEventListener('pointerdown', e => {
    cam.isDragging = true;
    cam.lastX = e.clientX;
    cam.lastY = e.clientY;
    canvas.setPointerCapture(e.pointerId);
  });

  canvas.addEventListener('pointermove', e => {
    if (!cam.isDragging) return;
    cam.x += e.clientX - cam.lastX;
    cam.y += e.clientY - cam.lastY;
    cam.lastX = e.clientX;
    cam.lastY = e.clientY;
    draw();
  });

  canvas.addEventListener('pointerup', e => {
    cam.isDragging = false;
    canvas.releasePointerCapture(e.pointerId);
  });

  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    const zoomFactor = Math.exp((e.deltaY < 0 ? 1 : -1) * 0.2);
    
    const rect = canvas.getBoundingClientRect();
    const mouseX = e.clientX - rect.left - rect.width / 2;
    const mouseY = e.clientY - rect.top - rect.height / 2;
    
    cam.x -= mouseX * (zoomFactor - 1);
    cam.y -= mouseY * (zoomFactor - 1);
    cam.zoom *= zoomFactor;
    cam.zoom = Math.max(0.001, Math.min(10000, cam.zoom));
    draw();
  }, { passive: false });

  // Pinch to zoom
  let touchDist = 0;
  canvas.addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
      touchDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
    }
  }, { passive: false });

  canvas.addEventListener('touchmove', e => {
    if (e.touches.length === 2) {
      e.preventDefault();
      const newDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      cam.zoom *= (newDist / touchDist);
      cam.zoom = Math.max(0.001, Math.min(10000, cam.zoom));
      touchDist = newDist;
      draw();
    }
  }, { passive: false });

  // ==========================================
  // UI LOGIC
  // ==========================================

  function buildList() {
    listEl.innerHTML = '';
    CATALOG.forEach(o => {
      const li = document.createElement('li');
      const btn = document.createElement('button');
      btn.className = 'item-btn';
      btn.innerHTML = `
        <span style="display:flex; gap:12px; align-items:center;">
          <span class="item-symbol">${o.symbol}</span>
          <span>${o.name}</span>
        </span>
        <span>${fmtKm(o.dist)}</span>
      `;
      btn.addEventListener('click', () => selectObject(o.id));
      li.appendChild(btn);
      listEl.appendChild(li);
    });
  }

  function selectObject(id) {
    selectedId = id;
    const o = CATALOG.find(x => x.id === id);
    
    // Update active state in list
    document.querySelectorAll('.item-btn').forEach(el => el.classList.remove('active'));
    const btns = Array.from(document.querySelectorAll('.item-btn'));
    const targetBtn = btns.find(b => b.textContent.includes(o.name));
    if (targetBtn) targetBtn.classList.add('active');

    // Show GO button
    goBtn.classList.remove('hidden');
    goBtn.textContent = 'GO';

    // Auto-zoom to fit both objects
    const rect = canvas.parentElement.getBoundingClientRect();
    const maxCanvasDist = Math.min(rect.width, rect.height) * 0.8; 
    const newZoom = (maxCanvasDist * BASE_KM_PER_PX) / o.dist;
    
    cam.zoom = newZoom;
    cam.x = 0;
    cam.y = rect.height * 0.15; // Push Earth towards the bottom
    
    draw();
    walkViewEl.classList.add('hidden');
  }

  function updateWalk() {
    if (!walk) return;
    const o = CATALOG.find(x => x.id === walk.objectId);
    if (!o) { walk = null; writeWalk(null); return showVisual(); }

    const elapsed = Math.max(0, Date.now() - walk.startedAt);
    const walkedRaw = (elapsed / 3600000) * PACE;
    const walked = Math.min(walkedRaw, o.dist);
    const remaining = Math.max(0, o.dist - walkedRaw);
    const pct = Math.min(100, (walkedRaw / o.dist) * 100);
    const done = remaining <= 0;

    wPct.textContent = done ? '100%' : pct.toFixed(4) + '%';
    wFill.style.width = pct + '%';
    
    wWalked.textContent = fmtWalked(walked);
    wLeft.textContent = done ? '0 km' : fmtWalked(remaining);
    wElapsed.textContent = fmtElapsed(elapsed);
    wEta.textContent = done ? 'Arrived 🎉' : fmtDur(remaining / PACE);
  }

  function showWalk() {
    if (!walk) return showVisual();
    
    const o = CATALOG.find(x => x.id === walk.objectId);
    wTitle.textContent = 'Walking to ' + o.name;
    
    updateWalk();
    if (timer) clearInterval(timer);
    timer = setInterval(updateWalk, 1000);
    
    walkViewEl.classList.remove('hidden');
    goBtn.classList.add('hidden');
  }

  function showVisual() {
    if (timer) clearInterval(timer);
    walkViewEl.classList.add('hidden');
    document.getElementById('banner').classList.add('hidden');
    goBtn.classList.remove('hidden');
    draw();
  }

  goBtn.addEventListener('click', () => {
    if (walk && !confirm(`You're already walking to ${walk.objectId}.\n\nAbandon that walk?`)) return;
    walk = { objectId: selectedId, startedAt: Date.now(), pace: PACE };
    writeWalk(walk);
    showWalk();
  });

  $('wBrowse').addEventListener('click', showVisual);

  $('wAbandon').addEventListener('click', () => {
    if (!confirm('Abandon this walk?')) return;
    walk = null;
    writeWalk(null);
    showVisual();
  });

  // Init
  window.addEventListener('resize', resize);
  buildList();
  resize();
  selectObject(selectedId);

  // Check if there is an active walk
  if (walk) {
    document.getElementById('banner').classList.remove('hidden');
    document.getElementById('bannerDest').textContent = CATALOG.find(x => x.id === walk.objectId).name;
    document.getElementById('bannerResume').addEventListener('click', showWalk);
    selectObject(walk.objectId);
  }

})();
</script>
</body>
</html>
